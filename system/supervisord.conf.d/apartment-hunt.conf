# Aggregates San Francisco rental listings from many landlord websites into one
# scored, ranked, map-based view.
#
# A manifest app (system/apps/apartment_hunt/app.toml): forward_port.py registers it
# from the manifest, and it runs as its own entry point rather than under
# `uv run`. The `user` OOM band sheds it before any built-in service. Per-app
# data lives under data/.apps/apartment-hunt/.
[program:apartment-hunt]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/apartment_hunt && uv sync --locked --project system/apps/apartment_hunt && python3 system/scripts/forward_port.py --manifest system/apps/apartment_hunt/app.toml --url http://localhost:8088 && exec system/apps/apartment_hunt/.venv/bin/apartment-hunt"
directory=/home/user/workspace
autostart=false
autorestart=false
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/apartment-hunt-stdout.log
stderr_logfile=/var/log/supervisor/apartment-hunt-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
